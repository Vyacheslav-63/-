e`,moduleId:`city`,type:`dialogue`,titleRu:`Диалог: Спрашиваем дорогу у прохожего`,subtitleRu:`Метро, повороты, ориентиры и расстояние`,durationMinutes:5,xpReward:55,gemsReward:10,completed:!1,stars:0},{id:`city-test`,moduleId:`city`,type:`test`,titleRu:`Тест: Навигация в городе`,subtitleRu:`Аудирование направлений: left, right, straight ahead`,durationMinutes:4,xpReward:45,gemsReward:8,completed:!1,stars:0}]},{id:`emergency`,order:6,titleRu:`Аптека и помощь`,descriptionRu:`Как объяснить самочувствие, купить лекарства и позвать на помощь.`,icon:`🚑`,accentColor:`#DC2626`,level:`A2`,lessons:[{id:`emergency-pattern`,moduleId:`emergency`,type:`pattern`,titleRu:`Шаблон: «У меня болит... / Мне нужно лекарство»`,subtitleRu:`Четкие фразы, которые спасут в сложной ситуации`,durationMinutes:4,xpReward:40,gemsReward:6,completed:!1,stars:0},{id:`emergency-dialogue`,moduleId:`emergency`,type:`dialogue`,titleRu:`Диалог: Визит в аптеку за границей`,subtitleRu:`Симптомы: головная боль, простуда, дозировка`,durationMinutes:5,xpReward:55,gemsReward:12,completed:!1,stars:0},{id:`emergency-test`,moduleId:`emergency`,type:`test`,titleRu:`Тест: Здоровье и безопасность`,subtitleRu:`Быстрое понимание надписей и инструкций`,durationMinutes:4,xpReward:45,gemsReward:8,completed:!1,stars:0}]}],te={"cafe-dialogue":{id:`cafe-dialogue`,moduleId:`cafe`,titleRu:`Заказ в кофейне Starbucks`,contextRu:`Вы зашли в уютную кофейню на Манхэттене. За стойкой бариста Сара готова принять ваш заказ.`,partnerName:`Сара`,partnerRole:`Бариста кофейни`,partnerAvatar:`👩‍🦰`,location:`Кофейня в Нью-Йорке`,difficulty:`Легкий`,cultureTipRu:`💡 В США и Великобритании не говорят "Give me coffee" — это звучит как приказ. Говорите "Could I have..." или "Can I get...". Обязательно добавляйте "please" в конце!`,exchanges:[{id:`cafe-ex-1`,npcMessage:`Hi there! What can I get started for you today?`,npcMessageRu:`Привет! Что я могу для вас приготовить сегодня?`,phoneticRu:`[Хай зэа! Уот кэн ай гет ста́ртид фо ю тудэ́й?]`,tipRu:`Стандартное приветствие бариста. Она просто спрашивает: "Что будете заказывать?".`,correctPhrase:`Hi! Could I have a medium latte, please?`,options:[{id:`opt-1a`,textEn:`Hi! Could I have a medium latte, please?`,textRu:`Здравствуйте! Можно мне средний латте, пожалуйста?`,phoneticRu:`[Хай! Куд ай хэв э ми́диэм ла́ттэй, плиз?]`,isCorrect:!0,feedbackRu:`Идеально! Вежливая формула "Could I have..." звучит максимально естественно и дружелюбно.`,chunks:[{en:`Could I have`,ru:`Можно мне (вежливо)`},{en:`medium`,ru:`средний (размер)`},{en:`please`,ru:`пожалуйста`}]},{id:`opt-1b`,textEn:`I want coffee now quickly.`,textRu:`Я хочу кофе сейчас быстро.`,phoneticRu:`[Ай уонт ко́фи нау куи́кли]`,isCorrect:!1,feedbackRu:`Это звучит слишком требовательно и даже грубо для носителя языка.`},{id:`opt-1c`,textEn:`Give me latte.`,textRu:`Дай мне латте.`,phoneticRu:`[Гив ми ла́ттэй]`,isCorrect:!1,feedbackRu:`Прямой перевод русской фразы «Дайте мне», но в английском звучит невежливо без "Could I have" или "please".`}]},{id:`cafe-ex-2`,npcMessage:`Sure thing! What kind of milk would you prefer? Whole, skim, or oat?`,npcMessageRu:`Конечно! Какое молоко предпочитаете? Обычное, обезжиренное или овсяное?`,phoneticRu:`[Шуа синг! Уот кайнд оф милк вуд ю прифё́? Хоул, ским о оут?]`,tipRu:`"Sure thing" означает "Без проблем / С удовольствием". Затем следует выбор молока.`,correctPhrase:`Oat milk, please. And no sugar.`,options:[{id:`opt-2a`,textEn:`Oat milk, please. And no sugar.`,textRu:`Овсяное молоко, пожалуйста. И без сахара.`,phoneticRu:`[Оут милк, плиз. Энд ноу шу́гэ]`,isCorrect:!0,feedbackRu:`Отлично! Коротко, вежливо и понятно. "No sugar" — без сахара.`,chunks:[{en:`Oat milk`,ru:`Овсяное молоко`},{en:`no sugar`,ru:`без сахара`}]},{id:`opt-2b`,textEn:`Without sweet powder.`,textRu:`Без сладкого порошка.`,phoneticRu:`[Уизáут суит па́удэ]`,isCorrect:!1,feedbackRu:`Сахар — это просто "sugar", не нужно придумывать сложные описания.`}]},{id:`cafe-ex-3`,npcMessage:`Got it! Is that for here, or to go?`,npcMessageRu:`Поняла! Вам здесь или с собой?`,phoneticRu:`[Гот ит! Из зэт фо хи́а, о ту го́у?]`,tipRu:`💡 Запомните: "for here" = пить в заведении, "to go" (или "takeaway" в Британии) = навынос / с собой.`,correctPhrase:`To go, please. And could I get the bill?`,options:[{id:`opt-3a`,textEn:`To go, please. How much is it?`,textRu:`С собой, пожалуйста. Сколько с меня?`,phoneticRu:`[Ту го́у, плиз. Хау мач из ит?]`,isCorrect:!0,feedbackRu:`Супер! «To go» — именно так говорят в 99% случаев в США.`,chunks:[{en:`To go`,ru:`Навынос / С собой`},{en:`How much is it?`,ru:`Сколько это стоит? / Сколько с меня?`}]},{id:`opt-3b`,textEn:`I will drink in the street with myself.`,textRu:`Я буду пить на улице с собой.`,phoneticRu:`[Ай уил дринк ин зэ стрит уиз майсéлф]`,isCorrect:!1,feedbackRu:`Типичная калька с русского! Носители скажут просто два слова: "To go".`}]},{id:`cafe-ex-4`,npcMessage:`That’ll be $4.50. You can tap your card right here.`,npcMessageRu:`С вас 4 доллара 50 центов. Можете приложить карту прямо сюда.`,phoneticRu:`[Зэтл би фо́ фи́фти. Ю кэн тэп ё ка́рд райт хи́а]`,tipRu:`"Tap your card" = приложить бесконтактную карту.`,correctPhrase:`Here you go. Thank you so much, have a great day!`,options:[{id:`opt-4a`,textEn:`Here you go! Thank you, have a good one!`,textRu:`Вот, пожалуйста! Спасибо, хорошего дня!`,phoneticRu:`[Хи́а ю го́у! Сэнк ю, хэв э гуд уан!]`,isCorrect:!0,feedbackRu:`Блестяще! "Here you go" = "Вот, держите/пожалуйста", а "Have a good one" — популярное теплое пожелание.`,chunks:[{en:`Here you go`,ru:`Вот, пожалуйста (когда передаете что-то)`},{en:`Have a good one`,ru:`Хорошего дня / Всего доброго`}]},{id:`opt-4b`,textEn:`Take my money bye.`,textRu:`Возьми мои деньги пока.`,phoneticRu:`[Тэйк май ма́ни бай]`,isCorrect:!1,feedbackRu:`Слишком резко! Фраза "Here you go" гораздо вежливее.`}]}]},"travel-dialogue":{id:`travel-dialogue`,moduleId:`travel`,titleRu:`Паспортный контроль в Хитроу`,contextRu:`Вы прилетели в Лондон. Офицер пограничной службы задает стандартные вопросы о цели поездки.`,partnerName:`Офицер Смит`,partnerRole:`Пограничный контроль`,partnerAvatar:`👮‍♂️`,location:`Аэропорт Хитроу, Лондон`,difficulty:`Средний`,cultureTipRu:`💡 Офицеры любят краткие и четкие ответы: "Tourism", "Vacation", "Visiting friends". Не нужно рассказывать длинные истории.`,exchanges:[{id:`travel-ex-1`,npcMessage:`Good afternoon. Passport and landing card, please.`,npcMessageRu:`Добрый день. Паспорт и посадочный талон/карту, пожалуйста.`,phoneticRu:`[Гуд а́фтэнун. Па́спот энд лэ́ндинг кард, плиз]`,tipRu:`Офицер просит ваши документы.`,correctPhrase:`Good afternoon. Here is my passport.`,options:[{id:`tr-1a`,textEn:`Good afternoon. Here you are, sir.`,textRu:`Добрый день. Вот, держите, сэр.`,phoneticRu:`[Гуд а́фтэнун. Хи́а ю а́, сё]`,isCorrect:!0,feedbackRu:`Идеально! Спокойный, уважительный ответ.`,chunks:[{en:`Here you are`,ru:`Вот, пожалуйста (передавая документы)`}]},{id:`tr-1b`,textEn:`Look at my book of travel.`,textRu:`Посмотри на мою книжку путешествий.`,phoneticRu:`[Лук эт май бук оф трэ́вл]`,isCorrect:!1,feedbackRu:`Паспорт — это "passport". "Here you are" — идеальная формулировка при передаче.`}]},{id:`travel-ex-2`,npcMessage:`What is the purpose of your visit?`,npcMessageRu:`Какова цель вашего визита?`,phoneticRu:`[Уот из зэ пё́пэс оф ё ви́зит?]`,tipRu:`Purpose = цель визита.`,correctPhrase:`I am here on vacation for tourism.`,options:[{id:`tr-2a`,textEn:`I am here on vacation. Just tourism for two weeks.`,textRu:`Я здесь в отпуске. Просто туризм на две недели.`,phoneticRu:`[Ай эм хи́а он вэйкэ́йшн. Джаст ту́ризм фо ту уи́кс]`,isCorrect:!0,feedbackRu:`Отлично! Четкий, понятный ответ, снимающий любые подозрения.`,chunks:[{en:`on vacation`,ru:`в отпуске`},{en:`for two weeks`,ru:`на две недели`}]},{id:`tr-2b`,textEn:`I want to live here maybe forever.`,textRu:`Я хочу жить здесь возможно навсегда.`,phoneticRu:`[Ай уонт ту лив хи́а мэ́йби форэ́вэ]`,isCorrect:!1,feedbackRu:`Опасно! Такой ответ вызовет долгий допрос по туристической визе.`}]},{id:`travel-ex-3`,npcMessage:`Where will you be staying?`,npcMessageRu:`Где вы будете проживать?`,phoneticRu:`[Уэ́а уил ю би стэ́йинг?]`,tipRu:`Офицер спрашивает название отеля или адрес.`,correctPhrase:`At the Central Hotel in London. Here is my booking.`,options:[{id:`tr-3a`,textEn:`At the Central Hotel. Here is my booking confirmation.`,textRu:`В отеле Central Hotel. Вот подтверждение бронирования.`,phoneticRu:`[Эт зэ Сэ́нтрал Хоутэ́л. Хи́а из май бу́кинг конфэмэ́йшн]`,isCorrect:!0,feedbackRu:`Замечательно! Наличие подтверждения брони (booking confirmation) всегда ускоряет процесс.`},{id:`tr-3b`,textEn:`I sleep somewhere on the bench.`,textRu:`Я посплю где-нибудь на скамейке.`,phoneticRu:`[Ай слип са́муэа он зэ бэнч]`,isCorrect:!1,feedbackRu:`Ни в коем случае! Всегда называйте отель или адрес.`}]},{id:`travel-ex-4`,npcMessage:`Everything looks good. Enjoy your stay in the UK!`,npcMessageRu:`Все в порядке. Приятного пребывания в Великобритании!`,phoneticRu:`[Э́врисинг лукс гуд. Инджо́й ё стэй ин зэ Ю-Кэй!]`,tipRu:`Штамп поставлен!`,correctPhrase:`Thank you very much. Have a nice day!`,options:[{id:`tr-4a`,textEn:`Thank you very much! Have a great day!`,textRu:`Большое спасибо! Хорошего вам дня!`,phoneticRu:`[Сэнк ю вэ́ри мач! Хэв э грэйт дэй!]`,isCorrect:!0,feedbackRu:`Поздравляем, контроль успешно пройден!`}]}]},"smalltalk-dialogue":{id:`smalltalk-dialogue`,moduleId:`smalltalk`,titleRu:`Знакомство на мероприятии`,contextRu:`Вы пришли на дружескую встречу или коворкинг. Рядом подсаживается парень по имени Алекс.`,partnerName:`Алекс`,partnerRole:`Дизайнер из Сиэтла`,partnerAvatar:`🧑‍💻`,location:`Коворкинг-кафе`,difficulty:`Легкий`,cultureTipRu:`💡 На вопрос "How are you?" в 95% случаев отвечают "Good, thanks! How about you?". Не принято жаловаться на жизнь или болезни при обычном приветствии.`,exchanges:[{id:`st-ex-1`,npcMessage:`Hey! Is this seat taken?`,npcMessageRu:`Привет! Это место занято?`,phoneticRu:`[Хэй! Из зис сит тэ́йкэн?]`,tipRu:`" осители очень ценят честность и с радостью говорят понятнее, когда узнают, что вы учите язык.`}]}]},"shopping-dialogue":{id:`shopping-dialogue`,moduleId:`shopping`,titleRu:`Покупка одежды в магазине`,contextRu:`Вы выбираете куртку в торговом центре. Консультант подходит предложить помощь.`,partnerName:`Эмма`,partnerRole:`Продавец-консультант`,partnerAvatar:`👩‍💼`,location:`Магазин одежды`,difficulty:`Легкий`,cultureTipRu:`💡 Если вы просто смотрите вещи и пока не готовы покупать, скажите: "I’m just looking, thank you!" — консультант сразу отойдет и не будет навязываться.`,exchanges:[{id:`shop-ex-1`,npcMessage:`Hello! Are you looking for anything in particular?`,npcMessageRu:`Здравствуйте! Вы ищете что-то конкретное?`,phoneticRu:`[Хэлóу! А ю лу́кинг фо э́нисинг ин пати́кьюла?]`,tipRu:`"In particular" = что-то конкретное/особенное.`,correctPhrase:`Could I try this jacket in a medium size?`,options:[{id:`shop-1a`,textEn:`Yes, could I try this jacket on in a medium size?`,textRu:`Да, могу я примерить эту куртку в среднем размере (M)?`,phoneticRu:`[Йес, куд ай трай зис джэ́кет он ин э ми́диэм сайз?]`,isCorrect:!0,feedbackRu:`Идеально! "Try on" = примерить, "in a medium size" = в размере М.`,chunks:[{en:`try on`,ru:`примерить`},{en:`medium size`,ru:`размер М (средний)`}]},{id:`shop-1b`,textEn:`I want wear clothes right now.`,textRu:`Я хочу надеть одежду прямо сейчас.`,phoneticRu:`[Ай уонт уэа кло́уз райт нау]`,isCorrect:!1,feedbackRu:`Примерить — это фразовый глагол "try on", а не просто "wear".`}]},{id:`shop-ex-2`,npcMessage:`Here you go! The fitting rooms are right around the corner.`,npcMessageRu:`Вот, держите! Примерочные прямо за углом.`,phoneticRu:`[Хи́а ю го́у! Зэ фи́ттинг румз а райт эра́унд зэ ко́нэ]`,tipRu:`Fitting rooms = примерочные кабинки.`,correctPhrase:`Thank you! Where can I pay?`,options:[{id:`shop-2a`,textEn:`Thank you so much! It fits great. Do you take credit cards?`,textRu:`Большое спасибо! Подошло отлично. Вы принимаете кредитные карты?`,phoneticRu:`[Сэнк ю соу мач! Ит фитс грэйт. Ду ю тэйк крэ́дит кардз?]`,isCorrect:!0,feedbackRu:`Супер! "It fits great" = сидит отлично / подходит по размеру.`,chunks:[{en:`It fits great`,ru:`Сидит отлично / размер подошел`},{en:`Do you take cards?`,ru:`Вы принимаете карты к оплате?`}]}]}]},"city-dialogue":{id:`city-dialogue`,moduleId:`city`,titleRu:`Спрашиваем дорогу в центре Лондона`,contextRu:`Вы вышли из метро и запутались на развилке улиц. Прохожий готов подсказать путь.`,partnerName:`Марк`,partnerRole:`Местный житель`,partnerAvatar:`🚶‍♂️`,location:`Trafalgar Square, London`,difficulty:`Средний`,cultureTipRu:`💡 Всегда начинайте вопрос про дорогу со слов: "Excuse me, sorry to bother you, but could you tell me how to get to...". Это сразу расположит человека к вам.`,exchanges:[{id:`city-ex-1`,npcMessage:`Hello! You look a bit lost. Can I help with anything?`,npcMessageRu:`Здравствуйте! Вы кажетесь немного растерянным. Могу чем-то помочь?`,phoneticRu:`[Хэлóу! Ю лук э бит лост. Кэн ай хэлп уиз э́нисинг?]`,tipRu:`"Look a bit lost" = выглядите заблудившимся.`,correctPhrase:`Excuse me, could you tell me how to get to the subway station?`,options:[{id:`city-1a`,textEn:`Excuse me, could you tell me how to get to the nearest tube station?`,textRu:`Прошу прощения, не подскажете, как добраться до ближайшей станции метро?`,phoneticRu:`[Икскью́з ми, куд ю тэл ми хау ту гет ту зэ ни́эрист тьюб стэ́йшн?]`,isCorrect:!0,feedbackRu:`Шикарно! В Лондоне метро называют "Tube" или "Underground", а фраза "how to get to..." — эталон вопроса о дороге.`,chunks:[{en:`Excuse me`,ru:`Прошу прощения`},{en:`how to get to`,ru:`как добраться до...`},{en:`nearest`,ru:`ближайший`}]}]},{id:`city-ex-2`,npcMessage:`Sure! Go straight ahead for two blocks, then turn left at the pharmacy.`,npcMessageRu:`Конечно! Идите прямо вперед два квартала, затем поверните налево у аптеки.`,phoneticRu:`[Шуа! Гоу стрэйт эхэ́д фо ту блокс, зэн тён лэфт эт зэ фа́рмаси]`,tipRu:`Straight ahead = прямо вперед; turn left = повернуть налево.`,correctPhrase:`Straight ahead, then left at the pharmacy. Is it far on foot?`,options:[{id:`city-2a`,textEn:`Got it: straight ahead, then left. Is it far on foot?`,textRu:`Понял: прямо вперед, потом налево. Пешком далеко?`,phoneticRu:`[Гот ит: стрэйт эхэ́д, зэн лэфт. Из ит фа́ он фут?]`,isCorrect:!0,feedbackRu:`Отлично! Повторение маршрута ("Got it...") помогает убедиться, что вы все поняли верно.`,chunks:[{en:`Is it far?`,ru:`Это далеко?`},{en:`on foot`,ru:`пешком`}]}]}]},"emergency-dialogue":{id:`emergency-dialogue`,moduleId:`emergency`,titleRu:`Визит в зарубежную аптеку`,contextRu:`После перелета разболелась голова и поднялась температура. Вы зашли в аптеку.`,partnerName:`Дэвид`,partnerRole:`Фармацевт`,partnerAvatar:`👨‍⚕️`,location:`Аптека Boots`,difficulty:`Средний`,cultureTipRu:`💡 Названия многих лекарств за границей отличаются от привычных в РФ (например, Paracetamol / Acetaminophen вместо цитрамона или анальгина). Описывайте симптомы!`,exchanges:[{id:`em-ex-1`,npcMessage:`Hi, how can I help you today?`,npcMessageRu:`Здравствуйте, чем могу помочь?`,phoneticRu:`[Хай, хау кэн ай хэлп ю тудэ́й?]`,tipRu:`Опишите, что у вас болит.`,correctPhrase:`I have a terrible headache. Do you have painkillers?`,options:[{id:`em-1a`,textEn:`I have a bad headache and a sore throat. Do you have painkillers?`,textRu:`У меня сильно болит голова и болит горло. Есть ли у вас обезболивающее?`,phoneticRu:`[Ай хэв э бэд хэ́дэйк энд э со́ сро́ут. Ду ю хэв пэ́йнкилэз?]`,isCorrect:!0,feedbackRu:`Очень точно! "Headache" = головная боль, "sore throat" = больное горло, "painkillers" = обезболивающие.`,chunks:[{en:`headache`,ru:`головная боль`},{en:`sore throat`,ru:`больное горло`},{en:`painkillers`,ru:`обезболивающие таблетки`}]}]},{id:`em-ex-2`,npcMessage:`Yes, this ibuprofen will help. Take one pill every six hours with water.`,npcMessageRu:`Да, этот ибупрофен поможет. Принимайте по одной таблетке каждые 6 часов, запивая водой.`,phoneticRu:`[Йес, зис айбьюпро́фэн уил хэлп. Тэйк уан пил э́ври сикс áуэз уиз уо́тэ]`,tipRu:`Pill = таблетка; every six hours = каждые 6 часов.`,correctPhrase:`Understood. How much does it cost?`,options:[{id:`em-2a`,textEn:`Understood. One pill every six hours. How much is it?`,textRu:`Понял. Одна таблетка каждые 6 часов. Сколько стоит?`,phoneticRu:`[Андесту́д. Уан пил э́ври сикс áуэз. Хау мач из ит?]`,isCorrect:!0,feedbackRu:`Прекрасно! Четко зафиксировали дозировку и спросили стоимость.`}]}]}},C={"cafe-pattern":{id:`cafe-pattern`,moduleId:`cafe`,categoryRu:`Вежливые просьбы и заказы`,formula:`Could I have [что-то], please?`,formulaRu:`Можно мне [что-то], пожалуйста?`,explanationRu:`Самый естественный способ попросить что-то в магазине, кафе, отеле или самолете. Носители языка воспринимают эту фразу как идеальный баланс вежливости.`,literalMeaningRu:`«Мог бы я иметь...» (буквальный перевод звучит странно по-русски, но это главная формула вежливости в английском).`,culturalTipRu:`Никогда не переводите русское «Дайте мне» как «Give me». Для англичанина или американца «Give me» звучит как угроза или требование грабителя. Всегда заменяйте на «Could I have...»!`,slots:[{name:`предмет заказа`,nameRu:`Что заказываем`,options:[{en:`a cup of coffee`,ru:`чашку кофе`,phonetic:`[э кап оф ко́фи]`},{en:`a glass of water`,ru:`стакан воды`,phonetic:`[э глас оф уо́тэ]`},{en:`the bill`,ru:`счет`,phonetic:`[зэ бил]`},{en:`a receipt`,ru:`чек`,phonetic:`[э риси́т]`},{en:`a bottle of still water`,ru:`бутылку воды без газа`,phonetic:`[э ботл оф стил уо́тэ]`}]}],examples:[{en:`Could I have a cup of coffee, please?`,ru:`Можно мне чашку кофе, пожалуйста?`,phonetic:`[Куд ай хэв э кап оф ко́фи, плиз?]`,chunks:[{en:`Could I have`,ru:`Можно мне...`},{en:`a cup of coffee`,ru:`чашку кофе`}]},{en:`Could I have the bill, please?`,ru:`Можно мне счет, пожалуйста?`,phonetic:`[Куд ай хэв зэ бил, плиз?]`,chunks:[{en:`the bill`,ru:`счет (в ресторане)`}]},{en:`Could I have a receipt, please?`,ru:`Можно чек, пожалуйста?`,phonetic:`[Куд ай хэв э риси́т, плиз?]`,chunks:[{en:`a receipt`,ru:`кассовый чек`}]}]},"travel-pattern":{id:`travel-pattern`,moduleId:`travel`,categoryRu:`Поиск мест и навигация`,formula:`I'm looking for [место / вещь]`,formulaRu:`Я ищу [место / вещь]`,explanationRu:`Вместо сложного вопроса «Где находится...» носители очень часто говорят просто: «Я ищу...». Это звучит дружелюбно и приглашает человека подсказать дорогу.`,literalMeaningRu:`«Я нахожусь в процессе смотрения/поиска чего-то».`,culturalTipRu:`Если к вам в аэропорту или на улице подошел сотрудник и спросил "Can I help you?", вы можете просто ответить: "Hi, I'm looking for Gate 12" — и вам сразу покажут направление рукой.`,slots:[{name:`что вы ищете`,nameRu:`Объект поиска`,options:[{en:`Gate 24`,ru:`выход на посадку 24`,phonetic:`[гэйт туэ́нти фо́]`},{en:`the baggage claim`,ru:`зону выдачи багажа`,phonetic:`[зэ бэ́гидж клэйм]`},{en:`the restroom`,ru:`туалет`,phonetic:`[зэ рэ́струм]`},{en:`a currency exchange`,ru:`обмен валюты`,phonetic:`[э ка́рэнси эксчэ́йндж]`},{en:`the check-in desk`,ru:`стойку регистрации`,phonetic:`[зэ чэк-ин дэск]`}]}],examples:[{en:`Excuse me, I'm looking for Gate 24.`,ru:`Прошу прощения, я ищу выход на посадку 24.`,phonetic:`[Икскью́з ми, айм лу́кинг фо гэйт туэ́нти фо́]`},{en:`Hi, I'm looking for the baggage claim area.`,ru:`Здравствуйте, я ищу зону выдачи багажа.`,phonetic:`[Хай, айм лу́кинг фо зэ бэ́гидж клэйм э́риа]`},{en:`Sorry, I'm looking for the nearest restroom.`,ru:`Извините, я ищу ближайший туалет.`,phonetic:`[Со́ри, айм лу́кинг фо зэ ни́эрист рэ́струм]`}]},"smalltalk-pattern":{id:`smalltalk-pattern`,moduleId:`smalltalk`,categoryRu:`Ежедневное общение`,formula:`How's it going? — Pretty good, thanks! How about you?`,formulaRu:`Как дела? — Довольно неплохо, спасибо! А у тебя?`,explanationRu:`Забудьте школьный шаблон «How are you? — I am fine, thank you, and you?». Носители в 90% случаев скажут «How’s it going?» или «How are things?», а ответят «Pretty good» или «Not bad!».`,literalMeaningRu:`«Как оно идет?» — «Довольно хорошо, спасибо!».`,culturalTipRu:`Вопрос «How’s it going?» часто является просто расширенным приветствием вроде «Привет, как жизнь!». Не нужно пускаться в подробные медицинские или финансовые детали.`,slots:[{name:`ответ`,nameRu:`Ваш ответ`,options:[{en:`Pretty good, thanks!`,ru:`Довольно хорошо, спасибо!`,phonetic:`[при́ти гуд, сэнкс]`},{en:`Not too bad, and you?`,ru:`Неплохо, а ты как?`,phonetic:`[нот ту бэд, энд ю?]`},{en:`Can’t complain!`,ru:`Не жалуюсь / грех жаловаться!`,phonetic:`[кант комплэ́йн]`},{en:`A bit busy today, but good.`,ru:`Сегодня немного занят, но в целом хорошо.`,phonetic:`[э бит би́зи тудэ́й, бат гуд]`}]}],examples:[{en:`Hey! How's it going? — Pretty good, thanks!`,ru:`Привет! Как дела? — Довольно хорошо, спасибо!`,phonetic:`[Хэй! Хауз ит го́уин? — При́ти гуд, сэнкс!]`},{en:`How are you doing? — Not too bad, how about you?`,ru:`Как поживаешь? — Неплохо, а ты сам как?`,phonetic:`[Хау а ю ду́ин? — Нот ту бэд, хау эба́ут ю?]`}]},"shopping-pattern":{id:`shopping-pattern`,moduleId:`shopping`,categoryRu:`Покупки и цены`,formula:`Do you have this in [размер / цвет]?`,formulaRu:`Есть ли это в [размере / цвете]?`,explanationRu:`Вместо того чтобы объяснять на пальцах, просто покажите вещь консультанту и скажите эту простую формулу.`,literalMeaningRu:`«Имеете ли вы это в...»`,culturalTipRu:`Размеры в английском: S (small), M (medium), L (large), XL (extra large). Если нужен размер больше — говорите "a bigger size", меньше — "a smaller size".`,slots:[{name:`размер или цвет`,nameRu:`Размер или цвет`,options:[{en:`a larger size`,ru:`размере побольше`,phonetic:`[э ла́рджэ сайз]`},{en:`a smaller size`,ru:`размере поменьше`,phonetic:`[э смо́лэ сайз]`},{en:`black`,ru:`черном цвете`,phonetic:`[блэк]`},{en:`medium`,ru:`среднем размере M`,phonetic:`[ми́диэм]`}]}],examples:[{en:`Excuse me, do you have this in a larger size?`,ru:`Извините, есть ли эта вещь на размер больше?`,phonetic:`[Икскью́з ми, ду ю хэв зис ин э ла́рджэ сайз?]`},{en:`Do you have this sweater in black?`,ru:`Есть ли этот свитер в черном цвете?`,phonetic:`[Ду ю хэв зис суэ́тэ ин блэк?]`}]},"city-pattern":{id:`city-pattern`,moduleId:`city`,categoryRu:`Город и расстояния`,formula:`How long does it take to get to [место] on foot?`,formulaRu:`Сколько времени займет добраться до [места] пешком?`,explanationRu:`«How long does it take...» — золотая конструкция для любых вопросов про время пути или выполнения дел.`,literalMeaningRu:`«Как долго это берет, чтобы добраться...»`,culturalTipRu:`«On foot» = пешком, «by taxi» = на такси, «by metro/subway» = на метро. Ответ обычно звучит как: "It takes about 10 minutes" (Около 10 минут).`,slots:[{name:`пункт назначения`,nameRu:`Куда идем`,options:[{en:`the city center`,ru:`центра города`,phonetic:`[зэ си́ти сэ́нтэ]`},{en:`the train station`,ru:`вокзала`,phonetic:`[зэ трэйн стэ́йшн]`},{en:`the museum`,ru:`музея`,phonetic:`[зэ мьюзи́эм]`},{en:`the beach`,ru:`пляжа`,phonetic:`[зэ бич]`}]}],examples:[{en:`How long does it take to get to the museum on foot?`,ru:`Сколько времени займет дойти до музея пешком?`,phonetic:`[Хау лонг даз ит тэйк ту гет ту зэ мьюзи́эм он фут?]`},{en:`How long does it take by taxi?`,ru:`Сколько времени это займет на такси?`,phonetic:`[Хау лонг даз ит тэйк бай тэ́кси?]`}]},"emergency-pattern":{id:`emergency-pattern`,moduleId:`emergency`,categoryRu:`Здоровье и помощь`,formula:`I'm allergic to [вещество / аллерген]`,formulaRu:`У меня аллергия на [вещество]`,explanationRu:`Критически важный шаблон в ресторанах и аптеках. Если у вас аллергия на орехи, лактозу или лекарство, вы должны знать эту фразу наизусть.`,literalMeaningRu:`«Я аллергичен к...»`,culturalTipRu:`В кафе за границей к этому относятся крайне серьезно. Достаточно сказать "I am allergic to nuts", и повар приготовит блюдо на отдельной чистой доске.`,slots:[{name:`аллерген`,nameRu:`На что аллергия`,options:[{en:`nuts`,ru:`орехи`,phonetic:`[натс]`},{en:`dairy / milk`,ru:`молочные продукты`,phonetic:`[дэ́ари / милк]`},{en:`penicillin`,ru:`пенициллин`,phonetic:`[пэниси́ллин]`},{en:`gluten`,ru:`глютен`,phonetic:`[глу́тэн]`},{en:`seafood`,ru:`морепродукты`,phonetic:`[си́фуд]`}]}],examples:[{en:`Please be careful, I'm allergic to nuts.`,ru:`Пожалуйста, будьте осторожны, у меня аллергия на орехи.`,phonetic:`[Плиз би кэ́афул, айм алё́рджик ту натс]`},{en:`Does this dish contain seafood? I'm allergic to it.`,ru:`Содержит ли это блюдо морепродукты? У меня на них аллергия.`,phonetic:`[Даз зис диш контэ́йн си́фуд? Айм алё́рджик ту ит]`}]}},ne={"cafe-test":[{id:`q-cafe-1`,type:`sentence_builder`,promptRu:`Соберите фразу: «Можно мне средний латте с собой, пожалуйста?»`,correctSentence:`Could I have a medium latte to go please?`,wordBank:[`Could`,`latte`,`to go`,`I`,`have`,`please?`,`a`,`medium`,`Give`,`want`],explanationRu:`«Could I have [item] to go, please?» — стандарт вежливости для заказа навынос.`,category:`Кофейня`},{id:`q-cafe-2`,type:`listening`,promptRu:`Послушайте вопрос бариста и выберите, о чем он спросил:`,audioText:`Is that for here, or to go?`,options:[{id:`q2-opt1`,text:`Вам здесь или навынос?`,isCorrect:!0,explanationRu:`«For here» — здесь, «to go» — навынос.`},{id:`q2-opt2`,text:`С сахаром или без?`,isCorrect:!1,explanationRu:`Про сахар спросили бы: «With or without sugar?».`},{id:`q2-opt3`,text:`Оплата картой или наличными?`,isCorrect:!1,explanationRu:`Про оплату спросили бы: «Cash or card?».`}],explanationRu:`Фраза «For here, or to go?» звучит при каждом заказе в фастфуде или кофейне в США.`,category:`Кофейня`},{id:`q-cafe-3`,type:`spot_mistake`,promptRu:`Найдите ошибку! Как русскоязычные ошибаются в кафе:`,options:[{id:`q3-opt1`,text:`Give me coffee without milk please`,isCorrect:!0,explanationRu:`«Give me» звучит грубо! Правильно: «Could I have a coffee without milk, please?».`},{id:`q3-opt2`,text:`Could I get an iced Americano, please?`,isCorrect:!1,explanationRu:`Это абсолютно правильная и естественная фраза.`},{id:`q3-opt3`,text:`How much is this croissant?`,isCorrect:!1,explanationRu:`Здес х людей.`},{en:`Good morning!`,ru:`Доброе утро!`,phoneticRu:`[Гуд мо́рнин!]`,tipRu:`Используется до 12:00 дня.`},{en:`Good evening!`,ru:`Добрый вечер!`,phoneticRu:`[Гуд и́внин!]`,tipRu:`Вежливое приветствие после 17:00–18:00.`},{en:`Thank you very much!`,ru:`Большое спасибо!`,phoneticRu:`[Сэ́нкью ве́ри мач!]`,tipRu:`На спасибо часто отвечают «You’re welcome!» (пожалуйста).`},{en:`You're welcome!`,ru:`Пожалуйста (не за что)!`,phoneticRu:`[Ю́а уэ́лкам!]`,tipRu:`Стандартный ответ на благодарность.`},{en:`Excuse me, can you help me?`,ru:`Извините, вы не могли бы мне помочь?`,phoneticRu:`[Икскью́з ми, кэн ю хэлп ми?]`,tipRu:`Excuse me используют, чтобы привлечь внимание прохожего или официанта.`},{en:`I'm sorry, I didn't understand.`,ru:`Извините, я не понял.`,phoneticRu:`[Айм со́ри, ай ди́днт андэстэ́нд.]`,tipRu:`Можно сразу добавить «Could you repeat that?» (Не могли бы вы повторить?).`},{en:`Yes, please.`,ru:`Да, пожалуйста.`,phoneticRu:`[Ес, плиз.]`,tipRu:`Вежливое согласие на предложение в кафе, самолёте или магазине.`},{en:`No, thank you.`,ru:`Нет, спасибо.`,phoneticRu:`[Но́у, сэ́нкью.]`,tipRu:`Вежливый отказ от пакета, чека или доп. услуг.`},{en:`Have a nice day!`,ru:`Хорошего дня!`,phoneticRu:`[Хэв э найс дэй!]`,tipRu:`Очень популярное прощание в магазинах и кофейнях.`},{en:`See you later!`,ru:`Увидимся позже!`,phoneticRu:`[Си ю лэ́йтэ!]`,tipRu:`Дружелюбное прощание со знакомыми.`},{en:`Can I have a cup of coffee, please?`,ru:`Можно мне чашку кофе, пожалуйста?`,phoneticRu:`[Кэн ай хэв э кап ов ко́фи, плиз?]`,tipRu:`«Can I have...» — самый естественный способ сделать заказ.`},{en:`Water without gas, please.`,ru:`Воду без газа, пожалуйста.`,phoneticRu:`[Уо́тэ уиза́ут гэс, плиз.]`,tipRu:`Носители также часто говорят «still water» (без газа) и «sparkling water» (с газом).`},{en:`For here or to go?`,ru:`Здесь или с собой?`,phoneticRu:`[Фо хи́а о ту го́у?]`,tipRu:`Так часто спрашивает бариста в кофейне.`},{en:`To go, please.`,ru:`С собой, пожалуйста.`,phoneticRu:`[Ту го́у, плиз.]`,tipRu:`В Великобритании также говорят «takeaway».`},{en:`Can I pay by card?`,ru:`Можно оплатить картой?`,phoneticRu:`[Кэн ай пэй бай кард?]`,tipRu:`Наличными — «by cash» или «in cash».`},{en:`The menu, please.`,ru:`Меню, пожалуйста.`,phoneticRu:`[Зэ мэ́нью, плиз.]`,tipRu:`Полная вежливая фраза: «Could I see the menu, please?»`},{en:`It was delicious!`,ru:`Было очень вкусно!`,phoneticRu:`[Ит уо́з дили́шэс!]`,tipRu:`Приятный комплимент официанту после еды.`},{en:`Where is the check-in counter?`,ru:`Где стойка регистрации?`,phoneticRu:`[Уэ́а из зэ чек-и́н ка́унтэ?]`,tipRu:`В аэропорту полезно иметь под рукой номер рейса (flight number).`},{en:`Where is the boarding gate?`,ru:`Где выход на посадку?`,phoneticRu:`[Уэ́а из зэ бо́рдин гэйт?]`,tipRu:`Номер выхода указан на посадочном талоне (boarding pass) как Gate.`},{en:`Where is the baggage claim?`,ru:`Где получение багажа?`,phoneticRu:`[Уэ́а из зэ бэ́гидж клэйм?]`,tipRu:`Ищите указатели «Baggage Claim» или «Arrivals».`},{en:`I have a reservation.`,ru:`У меня есть бронь.`,phoneticRu:`[Ай хэв э рэзэрвэ́йшн.]`,tipRu:`Скажите это на стойке регистрации в отеле или ресторане.`},{en:`What is the Wi-Fi password?`,ru:`Какой пароль от вай-фая?`,phoneticRu:`[Уо́т из зэ уа́й-фа́й пэ́суорд?]`,tipRu:`Часто пароль пишут на ключе от номера или чеке.`},{en:`At what time is check-out?`,ru:`Во сколько выезд из отеля?`,phoneticRu:`[Эт уо́т тайм из чек-а́ут?]`,tipRu:`Заселение — check-in, выселение — check-out.`},{en:`Take me to this address, please.`,ru:`Отвезите меня по этому адресу, пожалуйста.`,phoneticRu:`[Тэйк ми ту зис э́дрэс, плиз.]`,tipRu:`Удобно показать экран телефона с адресом водителю такси.`},{en:`How long does it take?`,ru:`Сколько времени это займёт?`,phoneticRu:`[Ха́у лонг даз ит тэйк?]`,tipRu:`Универсальный вопрос про дорогу, ожидание заказа или очередь.`},{en:`Where is the restroom?`,ru:`Где здесь туалет?`,phoneticRu:`[Уэ́а из зэ рэ́струм?]`,tipRu:`В США говорят restroom, в Европе чаще toilet или WC.`},{en:`Go straight ahead and turn left.`,ru:`Идите прямо и поверните налево.`,phoneticRu:`[Го́у стрэ́йт эхэ́д энд тёрн лэфт.]`,tipRu:`Направо — «turn right».`},{en:`Is it far from here?`,ru:`Это далеко отсюда?`,phoneticRu:`[Из ит фар фром хи́а?]`,tipRu:`Можно уточнить: «Can I walk there?» (Туда можно дойти пешком?).`},{en:`I am lost.`,ru:`Я заблудился.`,phoneticRu:`[Ай эм лост.]`,tipRu:`После этого удобно показать нужную точку на карте.`},{en:`How much is this?`,ru:`Сколько это стоит?`,phoneticRu:`[Ха́у мач из зис?]`,tipRu:`Для множественного числа: «How much are these?».`},{en:`Can I try this on?`,ru:`Можно это примерить?`,phoneticRu:`[Кэн ай трай зис он?]`,tipRu:`Примерочная называется «fitting room» или «changing room».`},{en:`Do you have a larger size?`,ru:`У вас есть размер побольше?`,phoneticRu:`[Ду ю хэв э ла́рджэ сайз?]`,tipRu:`Поменьше — «a smaller size».`},{en:`I'm just looking, thank you.`,ru:`Я просто смотрю, спасибо.`,phoneticRu:`[Айм джаст лу́кин, сэ́нкью.]`,tipRu:`Вежливый ответ продавцу, когда помощь пока не нужна.`},{en:`Where is the nearest pharmacy?`,ru:`Где ближайшая аптека?`,phoneticRu:`[Уэ́а из зэ ни́рэст фа́рмаси?]`,tipRu:`В Великобритании аптеку также называют chemist.`},{en:`I have a headache.`,ru:`У меня болит голова.`,phoneticRu:`[Ай хэв э хэ́дэйк.]`,tipRu:`Боль в животе — stomachache, зубная боль — toothache.`},{en:`I need a doctor.`,ru:`Мне нужен врач.`,phoneticRu:`[Ай нид э до́ктэ.]`,tipRu:`В экстренных случаях звоните 911 (США) или 112 (Европа).`},{en:`Call the police, please!`,ru:`Пожалуйста, вызовите полицию!`,phoneticRu:`[Кол зэ поли́с, плиз!]`,tipRu:`Критически важная фраза при потере документов или краже.`},{en:`What time is it?`,ru:`Который час?`,phoneticRu:`[Уо́т тайм из ит?]`,tipRu:`Также вежливо: «Could you tell me the time?».`},{en:`Where can I buy a SIM card?`,ru:`Где я могу купить сим-карту?`,phoneticRu:`[Уэ́а кэн ай бай э сим кард?]`,tipRu:`Часто продаются прямо в зоне прилёта аэропорта.`},{en:`My phone battery is dead.`,ru:`У меня
