name: Build Android APK & Portable App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Сборка SpeakEasy-English.apk (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle & portable HTML
        run: |
          npm run build
          npm run build:portable

      - name: Initialize Capacitor Android project
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "SpeakEasy English" "com.speakeasy.english" --web-dir=dist
          npx cap add android

      - name: Configure Android permissions and app icons
        run: |
          node -e '
          const fs = require("fs");
          const manifestPath = "android/app/src/main/AndroidManifest.xml";
          let manifest = fs.readFileSync(manifestPath, "utf8");
          if (!manifest.includes("android.permission.RECORD_AUDIO")) {
            manifest = manifest.replace(
              "<application",
              "    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n    <application"
            );
            fs.writeFileSync(manifestPath, manifest);
          }
          '
          node -e '
          const sharp = require("sharp");
          const fs = require("fs");
          const path = require("path");
          const src = path.resolve("public/pwa-512x512.png");
          const targets = [
            ["mipmap-mdpi", 48],
            ["mipmap-hdpi", 72],
            ["mipmap-xhdpi", 96],
            ["mipmap-xxhdpi", 144],
            ["mipmap-xxxhdpi", 192],
          ];
          (async () => {
            for (const [dir, size] of targets) {
              const outDir = path.resolve("android/app/src/main/res", dir);
              if (!fs.existsSync(outDir)) continue;
              await sharp(src).resize(size, size).png().toFile(path.join(outDir, "ic_launcher.png"));
              await sharp(src).resize(size, size).png().toFile(path.join(outDir, "ic_launcher_round.png"));
            }
          })();
          '

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../SpeakEasy-English.apk

      - name: Upload SpeakEasy-English.apk & Offline HTML
        uses: actions/upload-artifact@v4
        with:
          name: SpeakEasy-English-Mobile
          path: |
            SpeakEasy-English.apk
            downloads/SpeakEasy-English-Offline.html
          retention-days: 90

      - name: Attach APK to GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SpeakEasy-English.apk
            downloads/SpeakEasy-English-Offline.html
