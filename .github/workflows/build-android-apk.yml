name: Build Android APK & Portable App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Сборка SpeakEasy-English.apk (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle & portable HTML
        run: |
          npm run build
          npm run build:portable

      - name: Create Capacitor config & Android project
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.speakeasy.english",
            "appName": "SpeakEasy English",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Configure Android permissions and adaptive app icons
        run: |
          node -e '
          const fs = require("fs");
          const manifestPath = "android/app/src/main/AndroidManifest.xml";
          let manifest = fs.readFileSync(manifestPath, "utf8");
          const permissions = [
            "android.permission.RECORD_AUDIO",
            "android.permission.MODIFY_AUDIO_SETTINGS"
          ];
          for (const perm of permissions) {
            if (!manifest.includes(perm)) {
              manifest = manifest.replace(
                "<application",
                `    <uses-permission android:name="${perm}" />\n    <application`
              );
            }
          }
          fs.writeFileSync(manifestPath, manifest);
          '
          node -e '
          const sharp = require("sharp");
          const fs = require("fs");
          const path = require("path");
          const iconSrc = path.resolve("public/pwa-512x512.png");
          const maskableSrc = path.resolve("public/pwa-maskable-512x512.png");
          const targets = [
            ["mipmap-mdpi", 48, 108],
            ["mipmap-hdpi", 72, 162],
            ["mipmap-xhdpi", 96, 216],
            ["mipmap-xxhdpi", 144, 324],
            ["mipmap-xxxhdpi", 192, 432],
          ];
          (async () => {
            for (const [dir, size, fgSize] of targets) {
              const outDir = path.resolve("android/app/src/main/res", dir);
              if (!fs.existsSync(outDir)) continue;
              await sharp(iconSrc).resize(size, size).png().toFile(path.join(outDir, "ic_launcher.png"));
              await sharp(iconSrc).resize(size, size).png().toFile(path.join(outDir, "ic_launcher_round.png"));
              await sharp(maskableSrc).resize(fgSize, fgSize).png().toFile(path.join(outDir, "ic_launcher_foreground.png"));
            }
            const bgPath = path.resolve("android/app/src/main/res/values/ic_launcher_background.xml");
            if (fs.existsSync(bgPath)) {
              fs.writeFileSync(
                bgPath,
                "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n  <color name=\"ic_launcher_background\">#10B981</color>\n</resources>\n"
              );
            }
          })();
          '

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../SpeakEasy-English.apk

      - name: Upload SpeakEasy-English.apk & Offline HTML
        uses: actions/upload-artifact@v4
        with:
          name: SpeakEasy-English-Mobile
          path: |
            SpeakEasy-English.apk
            downloads/SpeakEasy-English-Offline.html
          retention-days: 90

      - name: Attach APK to GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SpeakEasy-English.apk
            downloads/SpeakEasy-English-Offline.html
